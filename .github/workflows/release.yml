# 交叉编译静态二进制并发布到 GitHub Release。
#
# 版本号来自仓库根目录的 VERSION，推 v<VERSION> tag 触发（与 rw-node-front 一致）。
# 产物名固定为 sshd-lite-linux-<arch>，并把最新一条始终标成 latest，所以
# releases/latest/download/<asset> 这个地址长期有效，下游脚本不必跟着版本号改。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            # tag 与 VERSION 对不上，等于把新二进制挂到别的版本号下，宁可失败也别发错。
            if [[ "$tag" != "v$file_version" ]]; then
              echo "::error::tag $tag 与 VERSION v$file_version 不一致"
              exit 1
            fi
          else
            tag="v$file_version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$file_version" >> "$GITHUB_OUTPUT"

      - name: Build static binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
              -o "dist/sshd-lite-linux-${arch}" .
          done
          ls -la dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum sshd-lite-linux-* > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: sshd-lite ${{ steps.version.outputs.tag }}
          files: dist/*
          make_latest: true
          body: |
            ## Assets

            - `sshd-lite-linux-amd64` — linux/amd64
            - `sshd-lite-linux-arm64` — linux/arm64
            - `checksums.txt` — 上面两个二进制的 sha256

            由 [rw-node](https://github.com/x-dora/rw-node) 通过 `.sshd-lite-version` 引用。
